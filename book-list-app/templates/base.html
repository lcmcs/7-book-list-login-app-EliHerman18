<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book List App</title>
    <style>
        .flash {
            padding: 12px 20px;
            margin: 10px 0;
            border-radius: 6px;
            font-weight: 600;
        }
        .flash-success { background-color: #d1fae5; color: #065f46; border: 1px solid #6ee7b7; }
        .flash-error   { background-color: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
        .flash-warning { background-color: #fef3c7; color: #92400e; border: 1px solid #fcd34d; }
        .flash-info    { background-color: #dbeafe; color: #1e40af; border: 1px solid #93c5fd; }
    </style>
</head>

<body>

    <nav>
        <a href="{{ url_for('books') }}">Book List</a>
        {% if session.get('logged_in') %}
            <a href="{{ url_for('logout') }}">Logout</a>
        {% else %}
            <a href="{{ url_for('login') }}">Login</a>
        {% endif %}
    </nav>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash flash-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}

</body>
</html>
